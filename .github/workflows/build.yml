name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-embed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --config src-tauri/tauri.conf.embed.json
      - uses: actions/upload-artifact@v4
        with:
          name: FileDock-embed
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-fixed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Download Fixed Version WebView2
        run: |
          curl -L -o wv2.cab "${{ secrets.WEBVIEW2_CAB_URL }}"
          expand wv2.cab -F:* src-tauri/webview2-runtime/
      - run: npx tauri build --config src-tauri/tauri.conf.fixed.json
      - uses: actions/upload-artifact@v4
        with:
          name: FileDock-fixed
          path: src-tauri/target/release/bundle/nsis/*.exe
