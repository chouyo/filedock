name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-embed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: app
      - run: ./scripts/build-windows.ps1 -Type embed
        shell: pwsh
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: FileDock-embed
          path: app/src-tauri/target/release/bundle/nsis/*.exe

  build-fixed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: app
      - name: Download Fixed Version WebView2
        working-directory: app
        run: |
          curl -L -o wv2.cab "${{ secrets.WEBVIEW2_CAB_URL }}"
          expand wv2.cab -F:* src-tauri/webview2-runtime/
      - run: ./scripts/build-windows.ps1 -Type fixed -NoPrompt
        shell: pwsh
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: FileDock-fixed
          path: app/src-tauri/target/release/bundle/nsis/*.exe
