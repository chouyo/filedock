name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
        env:
          # react-devtools pulls in electron; its binary isn't needed here
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
        working-directory: app
      - run: npm run typecheck
        working-directory: app
