[package]
name = "filedock"
version = "1.0.0"
description = "FileDock - Windows desktop file management application"
authors = ["FileDock"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "filedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
glob = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
notify = "6"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[features]
# This feature is used for production builds (no devtools)
default = []
